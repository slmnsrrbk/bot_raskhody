<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Расходы</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --pink:#FF2D55; --purple:#AF52DE; --gray:#8E8E93; --teal:#5AC8FA; --indigo:#5856D6;
  --sheet:#F2F2F7; --field:#FFFFFF; --shadow:0 1px 0 rgba(0,0,0,.02),0 8px 24px rgba(0,0,0,.05);
  --tab-bg:rgba(118,118,128,.12); --tab-active:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --label:#FFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --pink:#FF375F; --purple:#BF5AF2; --gray:#8E8E93; --teal:#64D2FF; --indigo:#5E5CE6;
  --sheet:#1C1C1E; --field:#2C2C2E; --shadow:none; --tab-bg:rgba(118,118,128,.24); --tab-active:#636366;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:17px;line-height:1.3;overscroll-behavior-y:none}
body{padding:0 0 calc(110px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}

/* ---- Header ---- */
.top{padding:calc(14px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:flex-end;justify-content:space-between}
.title{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.subtitle{font-size:13px;color:var(--label2);margin-top:4px;font-weight:500}
.subtitle::first-letter,.date-h::first-letter{text-transform:uppercase}
.addbtn{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,122,255,.35);transition:transform .15s}
.addbtn:active{transform:scale(.92)}
.addbtn svg{width:18px;height:18px}
.hbtns{display:flex;gap:8px;align-items:center}
.addbtn.scan{background:var(--card);color:var(--blue);box-shadow:var(--shadow),0 0 0 .5px var(--sep)}
.addbtn.scan svg{width:20px;height:20px}
.rc-item{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;position:relative;width:100%;text-align:left;min-height:58px}
.rc-item + .rc-item::before{content:"";position:absolute;left:56px;right:0;top:0;height:.5px;background:var(--sep)}
.rc-item:active{background:var(--fill)}
.rc-item .main{flex:1;min-width:0}
.rc-item .name{font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-item .rc-cat{font-size:13px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-item .amt{font-size:16px;font-weight:500;white-space:nowrap}
.rc-item .x{width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--label2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;margin-left:2px}
.rc-date{font-size:13px;font-weight:600;color:var(--label2);padding:12px 4px 6px;text-transform:uppercase;letter-spacing:.02em}
.rc-date:first-child{padding-top:2px}
.bigbtn{width:100%;height:50px;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-top:6px}
.bigbtn:disabled{opacity:.5}
.opt{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;position:relative;width:100%;text-align:left;font-size:17px}
.opt + .opt::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.opt:active{background:var(--fill)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--field);font-size:14px;font-weight:500;color:var(--label);white-space:nowrap;border:1.5px solid transparent}
.chip.sel{background:var(--blue);color:#fff}
.cal{background:var(--field);border-radius:14px;padding:12px 10px 8px;margin-bottom:12px;user-select:none}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.cal-h b{font-size:17px;font-weight:600}
.cal-h button{width:32px;height:32px;border-radius:50%;color:var(--blue);display:flex;align-items:center;justify-content:center}
.cal-h button svg{width:10px;height:16px}
.cal-h button:disabled{color:var(--label3)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.cal-w{text-align:center;font-size:12px;font-weight:600;color:var(--label2);padding:4px 0 6px}
.cal-d{height:40px;display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;border-radius:0}
.cal-d span{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.cal-d.mute{color:var(--label3)}
.cal-d.dis{color:var(--label3);opacity:.5;pointer-events:none}
.cal-d.today span{font-weight:700;color:var(--blue)}
.cal-d.in{background:color-mix(in srgb,var(--blue) 15%,transparent)}
.cal-d.start,.cal-d.end{background:color-mix(in srgb,var(--blue) 15%,transparent)}
.cal-d.start{border-radius:20px 0 0 20px}.cal-d.end{border-radius:0 20px 20px 0}.cal-d.start.end{border-radius:20px}
.cal-d.start span,.cal-d.end span{background:var(--blue);color:#fff;font-weight:600}
.cal-d.in.mute,.cal-d.start.mute,.cal-d.end.mute{color:var(--label)}
.range-lbl{text-align:center;font-size:15px;color:var(--label2);padding:0 0 10px}
.range-lbl b{color:var(--label);font-weight:600}
/* свайп по строке (iOS) */
.sw{position:relative;overflow:hidden;touch-action:pan-y;background:var(--card)}
.sw + .sw .sw-c::before{content:"";position:absolute;left:64px;right:0;top:0;height:.5px;background:var(--sep)}
.sw-c{position:relative;z-index:1;background:var(--card);will-change:transform}
.sw.anim .sw-c{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sw-c .row + .row::before{display:none}
.sw-side{position:absolute;top:0;bottom:0;display:flex;z-index:0}
.sw-left{left:0}.sw-right{right:0}
.sw-btn{width:72px;height:100%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sw-btn svg{width:24px;height:24px;transition:transform .2s}
.sw-btn.edit{background:var(--blue)}.sw-btn.del{background:var(--red)}
.sw.full .sw-btn.del{width:100%;align-items:flex-end;padding-right:24px}
.sw.full .sw-btn.del svg{transform:scale(1.15)}
.sw.gone{transition:height .32s cubic-bezier(.2,.8,.2,1),opacity .22s,margin .32s;height:0!important;opacity:0}
.group.gone{transition:height .32s cubic-bezier(.2,.8,.2,1),opacity .22s,margin .32s;height:0!important;opacity:0;margin-bottom:0!important;overflow:hidden}
.toast.action{pointer-events:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.toast.action button{color:var(--blue);font-weight:600;font-size:14px;filter:brightness(1.4)}
.spin{width:22px;height:22px;border:2.5px solid var(--fill2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- Period filter (pills, like a bank app) ---- */
.pf{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  background:var(--bg);scroll-padding-left:16px}
.pf::-webkit-scrollbar{display:none}
.pf::after{content:"";flex:none;width:8px}
.pf button{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--fill);font-size:14px;font-weight:600;color:var(--label);white-space:nowrap;
  display:flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .1s}
.pf button:active{transform:scale(.96)}
.pf button.on{background:var(--label);color:var(--bg)}
.pf button svg{width:15px;height:15px}
.pf button .pv{margin-left:8px;font-weight:500;opacity:.75}
.sheet .pf{position:static;padding-left:0;padding-right:0;margin-top:2px;background:transparent}
.linkbtn{color:var(--blue);font-size:15px;font-weight:500;padding:6px 10px}

/* ---- Cards ---- */
.section{margin:0 16px 22px}
.section-h{font-size:13px;font-weight:400;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 4px 7px;display:flex;justify-content:space-between;align-items:center;min-height:24px}
.section-h > span{display:inline-flex;align-items:center;gap:6px}
.section-h button{color:var(--blue);text-transform:none;font-size:15px;font-weight:400;letter-spacing:0;display:inline-flex;align-items:center;gap:5px;line-height:1;height:24px}
.section-h .sep{color:var(--label3);font-size:15px;line-height:1}
.section-h .fbtn svg{width:16px;height:16px;display:block}
.section-h .fbtn.on{font-weight:600}
.fsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 4px 10px;font-size:13px;color:var(--label2)}
.fsum .tag{background:var(--fill);border-radius:999px;padding:4px 10px;color:var(--label);font-weight:500}
.fsum button{color:var(--blue);font-size:13px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--field);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--label2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px;padding:0 4px 6px}
.bars div{flex:1;background:var(--blue);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.85;position:relative}
.bars div i{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:var(--label2)}
.bars-l{display:flex;gap:6px;padding:0 4px 14px}.bars-l span{flex:1;text-align:center;font-size:10px;color:var(--label3)}
.urow{display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative}
.urow + .urow::before{content:"";position:absolute;left:62px;right:0;top:0;height:.5px;background:var(--sep)}
.urow .av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.urow.off .av{background:var(--gray)}
.urow .main{flex:1;min-width:0}
.urow .name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .sub{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .tg{font-size:13px;font-weight:600;color:var(--red);flex:none;padding:6px 10px;border-radius:8px;background:var(--fill)}
.urow.off .tg{color:var(--green)}
.frange{display:flex;gap:10px}.frange .fields{flex:1;min-width:0}.frange .field label{width:auto}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.hero{padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .lbl{font-size:13px;font-weight:500;color:var(--label2)}
.hero .total{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.hero .delta{font-size:13px;font-weight:500;margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--fill)}
.hero .delta.down{color:var(--green)} .hero .delta.up{color:var(--red)}
.hero .delta svg{width:11px;height:11px}
.donut{width:104px;height:104px;flex:none;position:relative;transition:transform .15s}
.donut:active{transform:scale(.95)}
.bigchart{position:relative;width:220px;height:220px;margin:6px auto 14px}
.bigchart svg{transform:rotate(-90deg);width:100%;height:100%}
.bigchart circle{fill:none;stroke-width:26;cursor:pointer;transition:opacity .2s,stroke-width .2s}
.bigchart circle.dim{opacity:.25}
.bigchart circle.hot{stroke-width:30}
.bigchart .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;pointer-events:none}
.bigchart .c b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.bigchart .c span{font-size:13px;color:var(--label2);margin-top:2px}
.legend .row{min-height:50px}
.legend .dot{width:12px;height:12px;border-radius:50%;flex:none;margin:0 6px 0 2px}
.legend .row.hot{background:var(--fill)}
.legend .row + .row::before{left:58px}
.donut svg{transform:rotate(-90deg);width:100%;height:100%}
.donut circle{fill:none;stroke-width:12;stroke-linecap:butt;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--label2);font-weight:600}
.donut .c b{font-size:15px;color:var(--label);font-weight:700;letter-spacing:-.02em}

/* ---- Rows ---- */
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;position:relative;text-align:left;width:100%;transition:background .15s}
.row:active{background:var(--fill)}
.row + .row::before{content:"";position:absolute;left:64px;right:0;top:0;height:.5px;background:var(--sep)}
.ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;color:#fff}
.row .main{flex:1;min-width:0}
.row .name{font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--label2);margin-top:1px}
.row .amt{font-size:17px;font-weight:500;white-space:nowrap}
.row .sub.right{text-align:right}
.chev{width:8px;height:14px;color:var(--label3);flex:none;margin-left:2px}
.pct{color:var(--label2)}
.bar{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--cat,var(--blue));transform-origin:left;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.row.active{background:var(--fill)}
.date-h{font-size:17px;font-weight:700;color:var(--label);padding:8px 4px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em}
.date-h .num{font-size:15px;font-weight:500;color:var(--label2)}
.hero .tap{font-size:12px;color:var(--label2);margin-top:6px}
.group{margin-bottom:14px}

/* limits */
.lim{padding:12px 16px;position:relative}
.lim + .lim::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.lim .l1{display:flex;justify-content:space-between;font-size:15px}
.lim .l1 b{font-weight:600}
.lim .l2{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);margin-top:2px}
.lim .bar{height:6px;border-radius:3px;margin-top:8px}
.lim .bar i{background:var(--green)}
.lim.warn .bar i{background:var(--orange)} .lim.over .bar i{background:var(--red)}
.lim.over .l2 span:last-child{color:var(--red);font-weight:600}

.empty{padding:38px 20px;text-align:center;color:var(--label2);font-size:15px}
.empty .big{font-size:44px;margin-bottom:8px}
.skel{height:56px;background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 50%,var(--fill) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.first .section{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.section:nth-of-type(2){animation-delay:.05s}.section:nth-of-type(3){animation-delay:.1s}.section:nth-of-type(4){animation-delay:.15s}

/* ---- Sheet ---- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-radius:20px 20px 0 0;z-index:21;
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:6px}
.sheet-h h2{font-size:17px;font-weight:600;margin:0}
.sheet-h button{color:var(--blue);font-size:17px}
.sheet-h button.primary{font-weight:600}
.sheet-h button:disabled{color:var(--label3)}
.amount-field{text-align:center;padding:10px 0 6px}
.amount-field input{width:100%;text-align:center;border:0;background:transparent;font-size:48px;font-weight:700;letter-spacing:-.03em;outline:none;padding:0;caret-color:var(--blue)}
.amount-field input::placeholder{color:var(--label3)}
.amount-field .cur{font-size:13px;color:var(--label2);font-weight:500;margin-top:-2px}
.name-field{padding:8px 0 16px}
.name-field input{width:100%;text-align:center;border:0;background:var(--field);border-radius:14px;font-size:22px;font-weight:500;letter-spacing:-.01em;outline:none;padding:14px 16px;color:var(--label);caret-color:var(--blue)}
.name-field input::placeholder{color:var(--label3);font-weight:400}
.name-field input:focus{box-shadow:0 0 0 2px var(--blue) inset}
.fields{background:var(--field);border-radius:12px;overflow:hidden;margin-bottom:18px}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;height:46px;position:relative}
.field + .field::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.field label{width:92px;flex:none;font-size:17px}
.field input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0;text-align:right;color:var(--label)}
.field input[type=date]{-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--label3)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:12px;background:var(--field);font-size:10.5px;font-weight:500;color:var(--label2);border:2px solid transparent;transition:border-color .15s,transform .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cat .ico{width:34px;height:34px;font-size:18px}
.cat.sel{border-color:var(--blue);color:var(--label)}
.cat:active{transform:scale(.95)}
.danger{width:100%;height:50px;border-radius:12px;background:var(--field);color:var(--red);font-size:17px;font-weight:500;margin-top:4px}
.hint{font-size:13px;color:var(--label2);padding:0 16px 8px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--label);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:.3s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* main button fallback (вне Telegram) */
.mainbtn{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));height:50px;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;z-index:10;box-shadow:0 8px 20px rgba(0,122,255,.3)}
.mainbtn[hidden]{display:none}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 class="title">Расходы</h1>
    <div class="subtitle" id="subtitle">&nbsp;</div>
  </div>
  <div class="hbtns">
    <button class="addbtn scan" id="adminTop" aria-label="Админка" hidden>

<script>
(() => {

const EXTRA_COLORS = ["#FF6B6B","#4ECDC4","#FFB703","#8338EC","#3A86FF","#FB5607","#06D6A0","#EF476F","#118AB2","#F4A261"];
const catOf = c => CAT[c] || { e:"🏷️", c: EXTRA_COLORS[[...String(c)].reduce((a,ch)=>a+ch.charCodeAt(0),0) % EXTRA_COLORS.length], hex: EXTRA_COLORS[[...String(c)].reduce((a,ch)=>a+ch.charCodeAt(0),0) % EXTRA_COLORS.length] };
const allCats = () => (state.data && state.data.categories) || Object.keys(CAT);
const NBSP = " ";
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/\s/g, NBSP) + NBSP + "₽";
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

/* ---------- Theme ---------- */
function applyTheme(){

}
applyTheme();
if (tg) { tg.ready(); tg.expand(); tg.onEvent("themeChanged", applyTheme); try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){} }
else matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

const haptic = (kind) => { try { if (!tg) return; kind==="ok" ? tg.HapticFeedback.notificationOccurred("success") : kind==="err" ? tg.HapticFeedback.notificationOccurred("error") : kind==="selection" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(kind||"light"); } catch(e){} };

/* ---------- API ---------- */
async function api(path, opts={}) {
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if (tg && tg.initData) headers["X-Telegram-Init-Data"] = tg.initData;
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  let body = null; try { body = await r.json(); } catch(e){}
  if (!r.ok) throw new Error((body && body.error) || ("Ошибка " + r.status));
  return body;
}

/* ---------- Dates ---------- */
const isoToDate = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const daysBetween = (a,b) => Math.round((a - b) / 86400000);
function dateLabel(iso, todayIso){
  const d = isoToDate(iso), t = isoToDate(todayIso), diff = daysBetween(t, d);
  if (diff === 0) return "Сегодня"; if (diff === 1) return "Вчера";
  return d.getDate() + " " + MONTHS[d.getMonth()] + (d.getFullYear() !== t.getFullYear() ? " " + d.getFullYear() : "");
}
const PERIOD_DAYS = { day:1, week:7, month:30 };
function inWindow(item, todayIso, days, offset=0){
  if (!item.iso) return false;
  const diff = daysBetween(isoToDate(todayIso), isoToDate(item.iso)) - offset;
  return diff >= 0 && diff < days;
}
const addDays = (iso, n) => { const d = isoToDate(iso); d.setDate(d.getDate() + n); return toIso(d); };
const toIso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const firstOf = (y, m) => toIso(new Date(y, m, 1)), lastOf = (y, m) => toIso(new Date(y, m + 1, 0));
/* Готовые периоды — как фильтры в банковском приложении. [ключ, подпись, диапазон(today) -> [from,to] | null] */
const PRESETS = [
  ["day",       "Сегодня",        t => [t, t]],
  ["yesterday", "Вчера",          t => [addDays(t,-1), addDays(t,-1)]],
  ["week",      "Неделя",         t => [addDays(t,-6), t]],
  ["month",     "Месяц",          t => [addDays(t,-29), t]],
  ["thisMonth", "Этот месяц",     t => { const d = isoToDate(t); return [firstOf(d.getFullYear(), d.getMonth()), t]; }],
  ["lastMonth", "Прошлый месяц",  t => { const d = isoToDate(t); return [firstOf(d.getFullYear(), d.getMonth()-1), lastOf(d.getFullYear(), d.getMonth()-1)]; }],
  ["year",      "Год",            t => { const d = isoToDate(t); return [firstOf(d.getFullYear(), 0), t]; }],
  ["all",       "Всё время",      () => null],
];
const presetOf = k => PRESETS.find(p => p[0] === k);
function currentRange(todayIso){
  /* -> {from, to, prevFrom, prevTo} в ISO, включительно; null для «всё время» */
  let ft;
  if (state.period === "custom") { if (!state.range) return null; ft = [state.range.from, state.range.to]; }
  else { const p = presetOf(state.period) || PRESETS[0]; ft = p[2](todayIso); if (!ft) return null; }
  const [from, to] = ft;
  const len = daysBetween(isoToDate(to), isoToDate(from)) + 1;
  return { from, to, prevFrom: addDays(from, -len), prevTo: addDays(from, -1) };
}
const inRange = (item, from, to) => !!item.iso && item.iso >= from && item.iso <= to;
const SHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function rangeLabel(from, to){
  const a = isoToDate(from), b = isoToDate(to);
  if (from === to) return a.getDate() + " " + MONTHS[a.getMonth()];
  const y = a.getFullYear() !== b.getFullYear();
  if (!y && a.getMonth() === b.getMonth()) return `${a.getDate()}–${b.getDate()} ${SHORT[a.getMonth()]}`;
  return `${a.getDate()} ${SHORT[a.getMonth()]}${y?" "+a.getFullYear():""} – ${b.getDate()} ${SHORT[b.getMonth()]}${y?" "+b.getFullYear():""}`;
}

/* ---------- Render ---------- */
function periodLabel(R, t){
  switch (state.period) {
    case "custom": return R ? rangeLabel(R.from, R.to) : "за всё время";
    case "day": return "сегодня, " + t.getDate() + " " + MONTHS[t.getMonth()];
    case "yesterday": return "вчера, " + rangeLabel(R.from, R.to);
    case "week": return "последние 7 дней";
    case "month": return "последние 30 дней";
    case "thisMonth": return MONTHS_I[t.getMonth()] + " " + t.getFullYear();
    case "lastMonth": { const d = isoToDate(R.from); return MONTHS_I[d.getMonth()] + " " + d.getFullYear(); }
    case "year": return t.getFullYear() + " год";
    default: return "за всё время";
  }
}
const MONTHS_I = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
/* строка пресетов периода */
function periodStats(){
  const d = state.data, R = currentRange(d.today);
  const cur = R ? d.expenses.filter(x => inRange(x, R.from, R.to)) : d.expenses.filter(x => !!x.iso);
  const prev = R ? d.expenses.filter(x => inRange(x, R.prevFrom, R.prevTo)) : [];
  const byCat = {}; cur.forEach(x => { byCat[x.category] = (byCat[x.category]||0) + x.amount; });
  return { R, cur, total: sum(cur), prevTotal: sum(prev), cats: Object.entries(byCat).sort((a,b)=>b[1]-a[1]) };
}
function pillsInner(){
  const S = state.data ? periodStats() : null, R = S ? S.R : null;
  const customLbl = state.period === "custom" && R ? rangeLabel(R.from, R.to) : "Свой период";
  const cal = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>`;
  const lbl = (k, l) => state.period === k && S ? `${l}<span class="num pv">${fmt(S.total)}</span>` : l;
  return PRESETS.map(([k,l]) => `<button type="button" data-p="${k}" class="${state.period===k?"on":""}">${lbl(k, l)}</button>`).join("")
    + `<button type="button" data-p="custom" class="${state.period==="custom"?"on":""}">${cal}${lbl("custom", esc(customLbl))}</button>`;
}
function pillsHtml(){ return `<div class="pf" id="pf">${pillsInner()}</div>`; }
function scrollPills(root){
  const on = (root || document).querySelector(".pf button.on"); if (!on) return;
  const box = on.parentElement, x = on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2;
  box.scrollTo({ left: Math.max(0, x), behavior: "smooth" });
}
function heroInner(){
  const d = state.data, t = isoToDate(d.today), { R, cur, total, prevTotal, cats } = periodStats();
  let delta = "";
  if (R && prevTotal > 0) {
    const p = Math.round((total - prevTotal) / prevTotal * 100);
    const down = p <= 0;
    const txt = p > 300 ? `в ${Math.round(total / prevTotal)} раз больше, чем в прошлом периоде` : `${Math.abs(p)}% к прошлому периоду`;
    delta = `<div class="delta ${down?"down":"up"}"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${down?'<path d="M6 2v8M2 6l4 4 4-4"/>':'<path d="M6 10V2M2 6l4-4 4 4"/>'}</svg>${txt}</div>`;
  }
  const r = 40, C = 2*Math.PI*r; let off = 0;
  const segs = total ? cats.map(([c,a]) => { const len = a/total*C; const el = `<circle cx="52" cy="52" r="${r}" stroke="${catOf(c).hex}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off += len; return el; }).join("") : `<circle cx="52" cy="52" r="${r}" stroke="var(--fill2)" stroke-dasharray="${C} 0"/>`;
  const heroTitle = state.period === "day" ? "Потрачено сегодня" : "Потрачено · " + periodLabel(R, t);
  return `<button type="button" class="card hero" data-act="chart" style="width:100%;text-align:left">
    <div><div class="lbl">${heroTitle}</div><div class="total num">${fmt(total)}</div>${delta}<div class="tap">${cats.length ? cats.length + " " + plural(cats.length,"категория","категории","категорий") + " · нажмите для деталей" : "нажмите, чтобы увидеть категории"}</div></div>
    <div class="donut"><svg viewBox="0 0 104 104">${segs}</svg><div class="c"><b class="num">${cur.length}</b>${plural(cur.length,"трата","траты","трат")}</div></div>
  </button>`;
}
const DAYS_STEP = 60;
function feedDays(){
  /* все дни с операциями, новые сверху; фильтр по категории — на всю ленту */
  const d = state.data;
  const list = applyFilter(d.expenses).filter(x => !!x.iso);
  const g = {}; list.forEach(x => (g[x.iso] ||= []).push(x));
  return { groups: g, keys: Object.keys(g).sort().reverse() };
}
function dayHtml(k, rows, todayIso){
  return `<div class="group" data-iso="${k}"><div class="date-h"><span>${dateLabel(k, todayIso)}</span><span class="num">−${fmt(sum(rows))}</span></div><div class="card">${
    rows.map(x => { const m = catOf(x.category); return `<div class="sw" data-sw="${x.id}">
      <div class="sw-side sw-left"><button type="button" class="sw-btn edit" data-edit="${x.id}" aria-label="Изменить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>
      <div class="sw-side sw-right"><button type="button" class="sw-btn del" data-del="${x.id}" aria-label="Удалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button></div>
      <div class="sw-c"><button class="row" data-id="${x.id}">
      <div class="ico" style="background:${m.c}">${m.e}</div>
      <div class="main"><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.category)}${x.note ? " · " + esc(x.note) : ""}</div></div>
      <div class="amt num">−${fmt(x.amount)}</div></button></div></div>`; }).join("")}</div></div>`;
}
function appendDays(){
  /* подгрузка следующих дней при прокрутке до конца — без кнопок */
  const feed = document.getElementById("feed"), sent = document.getElementById("sentinel"); if (!feed || !sent) return;
  const { groups, keys } = feedDays();
  const next = keys.slice(state.shown, state.shown + DAYS_STEP);
  sent.insertAdjacentHTML("beforebegin", next.map(k => dayHtml(k, groups[k], state.data.today)).join(""));
  state.shown += next.length;
  if (state.shown >= keys.length) sent.remove();
}
let sentinelIO = null;
function watchSentinel(){
  if (sentinelIO) sentinelIO.disconnect();
  const sent = document.getElementById("sentinel"); if (!sent) return;
  sentinelIO = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) appendDays(); }, { rootMargin: "600px 0px" });
  sentinelIO.observe(sent);
}
function render(){
  const d = state.data; if (!d) return;
  const t = isoToDate(d.today);
  document.getElementById("subtitle").textContent = periodLabel(periodStats().R, t);

  let html = pillsHtml();
  html += `<section class="section" id="heroSec">${heroInner()}</section>`;

  /* лимиты */
  const L = d.limits || {};
  const spent = { daily: sum(d.expenses.filter(x=>inWindow(x,d.today,1))), weekly: sum(d.expenses.filter(x=>inWindow(x,d.today,7))), monthly: sum(d.expenses.filter(x=>inWindow(x,d.today,30))) };
  const names = { daily:"День", weekly:"Неделя", monthly:"Месяц" };
  const limRows = ["daily","weekly","monthly"].filter(k=>L[k]).map(k => {
    const pct = Math.min(100, spent[k]/L[k]*100), left = L[k]-spent[k];
    const cls = pct >= 100 ? "over" : pct >= 80 ? "warn" : "";
    return `<div class="lim ${cls}"><div class="l1"><b>${names[k]}</b><span class="num">${fmt(spent[k])} <span class="pct">из ${fmt(L[k])}</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="l2"><span>${Math.round(pct)}%</span><span class="num">${left>=0?"осталось "+fmt(left):"превышен на "+fmt(-left)}</span></div></div>`;
  }).join("");
  /* блок лимитов показываем только если лимиты заданы; настраиваются по иконке в шапке */
  if (limRows) html += `<section class="section"><div class="section-h"><span>Лимиты</span><button data-act="limits">Изменить</button></div><div class="card">${limRows}</div></section>`;

  /* лента: все дни подряд, листается без кнопок; пресеты сверху следуют за прокруткой */
  const { groups, keys } = feedDays();
  state.shown = Math.min(keys.length, Math.max(state.shown || 0, DAYS_STEP));
  const txHtml = keys.slice(0, state.shown).map(k => dayHtml(k, groups[k], d.today)).join("");
  const fOn = filterActive(), nAll = keys.reduce((n, k) => n + groups[k].length, 0);
  const funnel = `<svg viewBox="0 0 24 24" fill="${fOn ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>`;
  const emptyMsg = fOn
    ? `<div class="card"><div class="empty"><div class="big">🔍</div>По фильтру ничего не найдено</div></div>`
    : `<div class="card"><div class="empty"><div class="big">💤</div>Пока пусто. Нажмите «+», чтобы добавить первую трату, или напишите боту: <b>такси 350</b></div></div>`;
  html += `<section class="section" id="feed"><div class="section-h"><span>Операции</span><span><button type="button" class="fbtn ${fOn?"on":""}" data-act="filter">${funnel}Фильтр</button><span class="sep">·</span><button data-act="export">Выгрузить</button></span></div>
    ${fOn ? `<div class="fsum">${filterSummary().map(t => `<span class="tag">${esc(t)}</span>`).join("")}<span>${nAll} ${plural(nAll,"операция","операции","операций")}</span><button type="button" data-act="clear">Сбросить</button></div>` : ""}
    ${txHtml || emptyMsg}${keys.length > state.shown ? `<div id="sentinel" style="height:1px"></div>` : ""}</section>`;
  html += `<div class="footer"><button data-act="lock" hidden></button></div>`;
  const app = document.getElementById("app");
  app.classList.toggle("first", !state.rendered); state.rendered = true;
  app.innerHTML = html;
  scrollPills(app);
  watchSentinel();
}
const sum = arr => arr.reduce((s,x)=>s+x.amount,0);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const m=n%10; return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c; };

/* ---------- Период ---------- */
function updatePeriodUI(){
  /* обновляем только пресеты, карточку и подпись — лента и позиция прокрутки не трогаются */
  if (!state.data) return;
  const t = isoToDate(state.data.today);
  document.getElementById("subtitle").textContent = periodLabel(periodStats().R, t);
  const pf = document.getElementById("pf"); if (pf) { pf.innerHTML = pillsInner(); scrollPills(pf.parentElement); }
  const hero = document.getElementById("heroSec"); if (hero) hero.innerHTML = heroInner();
}
function setPeriod(p, { scroll = true } = {}){
  state.period = p; state.pinned = true;
  updatePeriodUI();
  if (scroll) scrollToPeriod();
}
function pickPeriod(p, after){ haptic("light"); if (p === "custom") openPeriod(after); else { setPeriod(p, { scroll: !after }); if (after) after(); } }
function autoPeriodFor(iso){
  /* самый узкий пресет, в который попадает день */
  const t = state.data.today;
  for (const [k,, fn] of PRESETS) { const ft = fn(t); if (!ft || (iso >= ft[0] && iso <= ft[1])) return k; }
  return "all";
}
function topDayIso(){
  const pf = document.getElementById("pf"); if (!pf) return null;
  const line = pf.getBoundingClientRect().bottom + 6;
  const groups = document.querySelectorAll("#feed .group[data-iso]");
  for (const g of groups) { const r = g.getBoundingClientRect(); if (r.top <= line && r.bottom > line) return g.dataset.iso; }
  if (window.scrollY < 80 && groups.length) return groups[0].dataset.iso;   // наверху — считаем первый день
  return null;
}
function syncPeriodToScroll(){
  if (!state.data || Date.now() < (state.ignoreUntil || 0)) return;
  const iso = topDayIso(); if (!iso) return;
  const R = currentRange(state.data.today);
  const inside = R ? iso >= R.from && iso <= R.to : true;
  if (state.pinned && inside) return;                    // выбранный вручную период держим, пока листаем внутри него
  const k = autoPeriodFor(iso);
  if (k === state.period && !state.pinned) return;
  state.period = k; state.pinned = false;
  haptic("selection"); updatePeriodUI();

function scrollToPeriod(){

  const idx = R ? keys.findIndex(k => k <= R.to) : 0;

  const target = idx > 0 ? document.querySelector(`#feed .group[data-iso="${keys[idx]}"]`) : null;

const SW_W = 72;
const swipe = { el:null, content:null, x0:0, y0:0, base:0, pos:0, dragging:false, moved:false, openEl:null, ptr:null };
function swPos(el, x, anim){ el.classList.toggle("anim", !!anim); el.querySelector(".sw-c").style.transform = x ? `translateX(${x}px)` : ""; el.dataset.pos = x; }
function closeSwipe(){ if (swipe.openEl) { swPos(swipe.openEl, 0, true); swipe.openEl.classList.remove("full"); swipe.openEl = null; } }
const appEl = document.getElementById("app");
appEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const el = e.target.closest(".sw"); 
  if (!el) { if (swipe.openEl && !e.target.closest(".sheet")) closeSwipe(); return; }
  if (swipe.openEl && swipe.openEl !== el) closeSwipe();
  swipe.el = el; swipe.content = el.querySelector(".sw-c"); swipe.x0 = e.clientX; swipe.y0 = e.clientY;
  swipe.base = Number(el.dataset.pos || 0); swipe.pos = swipe.base; swipe.dragging = false; swipe.moved = false; swipe.ptr = e.pointerId;
}, {passive:true});
appEl.addEventListener("pointermove", e => {
  if (!swipe.el || e.pointerId !== swipe.ptr) return;
  const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if (!swipe.dragging) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { swipe.dragging = true; swipe.moved = true; try { swipe.el.setPointerCapture(e.pointerId); } catch(err){} }
    else if (Math.abs(dy) > 8) { swipe.el = null; return; }
    else return;
  }
  let x = swipe.base + dx;
  const w = swipe.el.clientWidth;
  if (x > SW_W) x = SW_W + (x - SW_W) * 0.25;                 // резинка справа
  if (x < -w * 0.62) { swipe.el.classList.add("full"); } else swipe.el.classList.remove("full");
  swipe.pos = x; swPos(swipe.el, x, false);
}, {passive:true});
function swipeEnd(e){
  if (!swipe.el || e.pointerId !== swipe.ptr) return;
  const el = swipe.el, x = swipe.pos, w = el.clientWidth;
  swipe.el = null;
  if (!swipe.dragging) return;
  if (x < -w * 0.62) {                                         // длинный свайп — удалить
    haptic("medium"); swPos(el, -w, true); el.classList.remove("full");
    setTimeout(() => deleteWithUndo(Number(el.dataset.sw)), 200);
    return;
  }
  if (x < -SW_W * 0.45) { swPos(el, -SW_W, true); swipe.openEl = el; haptic("light"); }
  else if (x > SW_W * 0.45) { swPos(el, SW_W, true); swipe.openEl = el; haptic("light"); }
  else { swPos(el, 0, true); if (swipe.openEl === el) swipe.openEl = null; }
}
appEl.addEventListener("pointerup", swipeEnd, {passive:true});
appEl.addEventListener("pointercancel", swipeEnd, {passive:true});

    wireEnter(done);
    document.getElementById("back").onclick = render;
    document.getElementById("ok").onclick = done;
    document.getElementById("rm").onclick = () => { haptic("medium"); items.splice(i,1); render(); };
  };
  render();
}

/* ---------- Админка владельца ---------- */
function ago(iso){
  if (!iso) return "—";
  const ms = Date.now() - new Date(iso).getTime(), m = Math.round(ms / 60000);
  if (m < 2) return "только что"; if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60); if (h < 24) return `${h} ч назад`;
  const d = Math.round(h / 24); if (d < 30) return `${d} ${plural(d,"день","дня","дней")} назад`;
  return new Date(iso).toLocaleDateString("ru-RU");
}
async function openAdmin(){
  openSheet(`<div class="grab"></div><div class="sheet-h"><button type="button" id="cancel">Закрыть</button><h2>Админка</h2><span></span></div><div class="empty"><div class="spin"></div></div>`, () => { document.getElementById("cancel").onclick = closeSheet; });
  let data;
  try { data = await api("/api/admin/overview"); } catch(e){ closeSheet(); toast(e.message); return; }
  let q = "";
  const render = () => {
    const S = data.stats, max = Math.max(1, ...data.series.map(x => x.n));
    const users = data.users.filter(u => !q || (u.first_name + " " + u.username + " " + u.id).toLowerCase().includes(q));
    const row = u => { const me = u.id === data.owner_id; const sub = [`id ${u.id}`, `был(а) ${ago(u.last_seen)}`, `${u.expenses} ${plural(u.expenses,"трата","траты","трат")}`, `${u.days_30} ${plural(u.days_30,"день","дня","дней")} из 30`].join(" · ");
      return `<div class="urow ${u.blocked?"off":""}" data-id="${u.id}"><div class="av">${esc((u.first_name || u.username || "?").slice(0,1).toUpperCase())}</div>
        <div class="main"><div class="name">${esc(u.first_name || "Без имени")}${u.username ? ` <span style="color:var(--label2);font-weight:400">@${esc(u.username)}</span>` : ""}${me ? " · вы" : ""}${u.blocked ? ' <span style="color:var(--red)">· доступ закрыт</span>' : ""}</div><div class="sub">${sub}</div></div>
        ${me ? "" : `<button type="button" class="tg" data-toggle="${u.id}">${u.blocked ? "Открыть" : "Закрыть"}</button>`}</div>`; };
    sheet.innerHTML = `<div class="grab"></div><div class="sheet-h"><button type="button" id="cancel">Закрыть</button><h2>Админка</h2><span></span></div>
      <div class="stats">
        <div class="stat"><b class="num">${S.total}</b><span>пользователей${S.blocked ? ` · ${S.blocked} без доступа` : ""}</span></div>
        <div class="stat"><b class="num">${S.active_today}</b><span>активны сегодня</span></div>
        <div class="stat"><b class="num">${S.active_7}</b><span>активны за 7 дней</span></div>
        <div class="stat"><b class="num">${S.daily_users}</b><span>пользуются ежедневно</span></div>
        <div class="stat"><b class="num">${S.avg_daily_7}</b><span>в среднем в день</span></div>
        <div class="stat"><b class="num">${S.expenses_7}</b><span>трат за 7 дней · всего ${S.expenses_total}</span></div>
      </div>
      <div class="hint">Активные пользователи по дням</div>
      <div class="card" style="padding:20px 10px 8px"><div class="bars">${data.series.map(x => `<div style="height:${Math.max(4, x.n / max * 100)}%"><i>${x.n || ""}</i></div>`).join("")}</div>
        <div class="bars-l">${data.series.map(x => `<span>${dateLabel(x.day, data.today).replace("Сегодня","Сег.").replace("Вчера","Вч.").replace(/ [а-я]+$/, m => " " + m.trim().slice(0,3))}</span>`).join("")}</div></div>
      <div class="hint" style="padding-top:16px">Пользователи · ${data.users.length}</div>
      <div class="fields"><div class="field"><label>Поиск</label><input id="uq" placeholder="имя, @username или id" value="${esc(q)}" autocomplete="off"></div></div>
      <div class="card" id="ulist">${users.map(row).join("") || `<div class="empty">Никого не найдено</div>`}</div>
      <div class="hint" style="padding-top:10px">Содержимое трат зашифровано и здесь не показывается. «Закрыть» отключает бота и приложение для пользователя, «Открыть» возвращает доступ.</div>`;
    document.getElementById("cancel").onclick = closeSheet;

    document.getElementById("ulist").addEventListener("click", async e => {

/* ---------- Фильтр операций: категории и сумма от/до ---------- */
function filterActive(){ const f = state.filter; return !!(f && ((f.cats && f.cats.length) || f.min != null || f.max != null)); }
function applyFilter(list){
  const f = state.filter; if (!filterActive()) return list;
  const cats = f.cats && f.cats.length ? new Set(f.cats) : null;
  return list.filter(x => (!cats || cats.has(x.category)) && (f.min == null || x.amount >= f.min) && (f.max == null || x.amount <= f.max));
}
function filterSummary(){
  const f = state.filter, out = [];
  if (f.cats && f.cats.length) out.push(f.cats.length <= 2 ? f.cats.join(", ") : `${f.cats.length} ${plural(f.cats.length,"категория","категории","категорий")}`);
  if (f.min != null && f.max != null) out.push(`${fmt(f.min)} – ${fmt(f.max)}`);
  else if (f.min != null) out.push(`от ${fmt(f.min)}`);
  else if (f.max != null) out.push(`до ${fmt(f.max)}`);
  return out;
}
function openFilter(){
  const f = state.filter || {}, sel = new Set(f.cats || []);
  const cats = allCats().slice();
  (state.data.expenses.map(x => x.category)).forEach(c => { if (!cats.includes(c)) cats.push(c); });
  const num = v => { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) && n >= 0 ? Math.round(n) : null; };
  const count = () => { const min = num(val("fmin")), max = num(val("fmax")); const cs = sel.size ? sel : null;
    return state.data.expenses.filter(x => !!x.iso && (!cs || cs.has(x.category)) && (min == null || x.amount >= min) && (max == null || x.amount <= max)).length; };
  openSheet(`<div class="grab"></div>
    <div class="sheet-h"><button type="button" id="cancel">Отмена</button><h2>Фильтр</h2><button type="button" class="primary" id="apply">Готово</button></div>
    <div class="hint">Категории</div>
    <div class="cats" id="fcats">${cats.map(c => { const m = catOf(c); return `<button type="button" class="cat ${sel.has(c)?"sel":""}" data-c="${esc(c)}"><div class="ico" style="background:${m.c}">${m.e}</div>${esc(c)}</button>`; }).join("")}</div>
    <div class="hint">Сумма</div>
    <div class="frange">
      <div class="fields"><div class="field"><label>От</label><input id="fmin" inputmode="numeric" placeholder="0" value="${f.min != null ? f.min : ""}"></div></div>
      <div class="fields"><div class="field"><label>До</label><input id="fmax" inputmode="numeric" placeholder="∞" value="${f.max != null ? f.max : ""}"></div></div>
    </div>
    <button type="button" class="bigbtn" id="fshow"></button>
    <button type="button" class="danger" id="freset" ${filterActive() ? "" : "hidden"}>Сбросить фильтр</button>`, () => {
    const showBtn = document.getElementById("fshow");
    const refresh = () => { const n = count(); showBtn.textContent = n ? `Показать ${n} ${plural(n,"операцию","операции","операций")}` : "Ничего не найдено"; };
    refresh();
    document.getElementById("fcats").addEventListener("click", e => { const b = e.target.closest(".cat"); if (!b) return; haptic("light"); const c = b.dataset.c; sel.has(c) ? sel.delete(c) : sel.add(c); b.classList.toggle("sel", sel.has(c)); refresh(); });
    ["fmin","fmax"].forEach(id => document.getElementById(id).addEventListener("input", refresh));
    const apply = () => {
      let min = num(val("fmin")), max = num(val("fmax"));
      if (min != null && max != null && min > max) [min, max] = [max, min];
      state.filter = { cats: [...sel], min, max };
      if (!filterActive()) state.filter = null;
      haptic("ok"); closeSheet(); render();
      const el = document.getElementById("feed"); if (el && filterActive()) el.scrollIntoView({behavior:"smooth", block:"start"});
    };
    document.getElementById("apply").onclick = apply; showBtn.onclick = apply;
    document.getElementById("cancel").onclick = closeSheet;
    document.getElementById("freset").onclick = () => { haptic("light"); state.filter = null; closeSheet(); render(); };
  });
}

/* ---------- Диаграмма по категориям ---------- */
function openChart(){
  const d = state.data; if (!d) return;
  const R = currentRange(d.today);
  const cur = R ? d.expenses.filter(x => inRange(x, R.from, R.to)) : d.expenses.filter(x => !!x.iso);
  const total = sum(cur);
  const byCat = {}; cur.forEach(x => { byCat[x.category] = (byCat[x.category]||0) + x.amount; });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const r = 90, C = 2*Math.PI*r; let off = 0;
  const segs = cats.map(([c,a]) => { const len = a/total*C; const el = `<circle cx="110" cy="110" r="${r}" stroke="${catOf(c).hex}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" data-c="${esc(c)}"/>`; off += len; return el; }).join("");
  const period = periodLabel(R, isoToDate(d.today));
  let hot = null;
  const body = `${pillsHtml()}
    <div class="hint" style="text-align:center">${period} · ${cur.length} ${plural(cur.length,"трата","траты","трат")}</div>
    <div class="bigchart" id="bigchart"><svg viewBox="0 0 220 220">${segs || `<circle cx="110" cy="110" r="${r}" stroke="var(--fill2)" stroke-dasharray="${C} 0"/>`}</svg><div class="c" id="chartC"><b class="num">${fmt(total)}</b><span>всего</span></div></div>
    ${cats.length ? `<div class="card legend" id="legend">${cats.map(([c,a]) => `<button type="button" class="row" data-c="${esc(c)}"><div class="ico" style="background:${catOf(c).c};width:30px;height:30px;font-size:15px;border-radius:8px">${catOf(c).e}</div><div class="main"><div class="name">${esc(c)}</div></div><div><div class="amt num">${fmt(a)}</div><div class="sub right num">${(a/total*100).toFixed(1)}%</div></div></button>`).join("")}</div>
    <div class="hint" style="text-align:center;padding-top:10px">Нажмите на категорию ещё раз, чтобы показать её операции</div>` : `<div class="empty">Нет трат за этот период</div>`}`;
  const fresh = !sheet.classList.contains("show") || !document.getElementById("bigchart");
  if (fresh) openSheet(`<div class="grab"></div><div class="sheet-h"><button type="button" id="cancel">Закрыть</button><h2>По категориям</h2><span></span></div><div id="chartBody"></div>`, () => { document.getElementById("cancel").onclick = closeSheet; });
  document.getElementById("chartBody").innerHTML = body;
  (() => {
    const pf = document.getElementById("chartBody").querySelector(".pf");
    pf.addEventListener("click", e => { const b = e.target.closest("button[data-p]"); if (!b) return; pickPeriod(b.dataset.p, openChart); });
    scrollPills(document.getElementById("chartBody"));
    if (!cats.length) return;
    const chart = document.getElementById("bigchart"), legend = document.getElementById("legend"), center = document.getElementById("chartC");
    const select = c => {
      if (hot === c) { state.filter = { cats: [c], min: null, max: null }; closeSheet(); render(); haptic("medium"); const el = document.querySelector('.section:nth-of-type(4)'); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
      hot = c; haptic("light");
      chart.querySelectorAll("circle").forEach(el => { el.classList.toggle("dim", el.dataset.c !== c); el.classList.toggle("hot", el.dataset.c === c); });
      legend.querySelectorAll(".row").forEach(el => el.classList.toggle("hot", el.dataset.c === c));
      const a = byCat[c]; center.innerHTML = `<b class="num">${fmt(a)}</b><span>${esc(c)} · ${(a/total*100).toFixed(1)}%</span>`;
    };
    chart.addEventListener("click", e => { const el = e.target.closest("circle"); if (el) select(el.dataset.c); else if (hot) { hot = null; chart.querySelectorAll("circle").forEach(x => x.classList.remove("dim","hot")); legend.querySelectorAll(".row").forEach(x => x.classList.remove("hot")); center.innerHTML = `<b class="num">${fmt(total)}</b><span>всего</span>`; } });
    legend.addEventListener("click", e => { const el = e.target.closest(".row"); if (el) select(el.dataset.c); });
  })();
}

/* ---------- Произвольный период: пресеты + календарь ---------- */
function presets(todayIso){
  const t = isoToDate(todayIso), y = t.getFullYear(), m = t.getMonth();
  const first = (yy, mm) => toIso(new Date(yy, mm, 1)), last = (yy, mm) => toIso(new Date(yy, mm + 1, 0));
  return [
    ["Вчера", addDays(todayIso,-1), addDays(todayIso,-1)],
    ["Этот месяц", first(y, m), todayIso],
    ["Прошлый месяц", first(y, m-1), last(y, m-1)],
    ["3 месяца", addDays(todayIso,-89), todayIso],
    ["Этот год", first(y, 0), todayIso],
    ["Всё время", null, null],
  ];
}
function openPeriod(after){
  const todayIso = state.data ? state.data.today : toIso(new Date());
  let from = state.range ? state.range.from : null, to = state.range ? state.range.to : null;
  let view = isoToDate(to || todayIso); view = new Date(view.getFullYear(), view.getMonth(), 1);
  const html = () => {
    const pr = presets(todayIso);
    return `<div class="grab"></div>
      <div class="sheet-h"><button type="button" id="cancel">Отмена</button><h2>Период</h2><button type="button" class="primary" id="apply">Готово</button></div>
      <div class="chips">${pr.map(([l,f,t],i) => `<button type="button" class="chip ${f===from&&t===to?"sel":""}" data-i="${i}">${l}</button>`).join("")}</div>
      <div class="range-lbl" id="rangeLbl"></div>
      <div class="cal" id="cal"></div>
      <div class="hint">Нажмите на дату начала, затем на дату конца. Один и тот же день — за один день.</div>`;
  };
  const drawCal = () => {
    const y = view.getFullYear(), m = view.getMonth();
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;   // понедельник = 0
    const daysIn = new Date(y, m+1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();
    let cells = "";
    for (let i = 0; i < 42; i++) {
      let day, mm = m, yy = y, mute = false;
      if (i < firstDow) { day = prevDays - firstDow + 1 + i; mm = m-1; mute = true; }
      else if (i - firstDow < daysIn) day = i - firstDow + 1;
      else { day = i - firstDow - daysIn + 1; mm = m+1; mute = true; }
      const iso = toIso(new Date(yy, mm, day));
      const cls = ["cal-d", mute?"mute":"", iso===todayIso?"today":"", iso>todayIso?"dis":"",
        from&&to&&iso>from&&iso<to?"in":"", iso===from?"start":"", iso===to?"end":""].join(" ");
      cells += `<button type="button" class="${cls}" data-d="${iso}"><span>${day}</span></button>`;
    }
    const next = new Date(y, m+1, 1) > isoToDate(todayIso);
    document.getElementById("cal").innerHTML = `<div class="cal-h">
      <button type="button" id="calPrev"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2L2 8l6 6"/></svg></button>
      <b>${MONTHS[m][0].toUpperCase()+MONTHS[m].slice(1).replace(/я$/,"ь").replace(/а$/,"")} ${y}</b>
      <button type="button" id="calNext" ${next?"disabled":""}><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l6 6-6 6"/></svg></button></div>
      <div class="cal-g">${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(w=>`<div class="cal-w">${w}</div>`).join("")}${cells}</div>`;
    document.getElementById("rangeLbl").innerHTML = from && to ? `<b>${rangeLabel(from,to)}</b> · ${daysBetween(isoToDate(to),isoToDate(from))+1} ${plural(daysBetween(isoToDate(to),isoToDate(from))+1,"день","дня","дней")}`
      : from ? `Начало: <b>${rangeLabel(from,from)}</b> — выберите конец` : "Всё время";
    sheet.querySelectorAll(".chip").forEach(c => { const [,f,t] = presets(todayIso)[Number(c.dataset.i)]; c.classList.toggle("sel", f===from && t===to); });
    document.getElementById("calPrev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); drawCal(); };
    document.getElementById("calNext").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); drawCal(); };
    document.getElementById("cal").querySelectorAll(".cal-d").forEach(b => b.onclick = () => {
      haptic("light"); const d = b.dataset.d;
      if (!from || (from && to)) { from = d; to = null; }
      else if (d < from) { to = from; from = d; }
      else to = d;
      drawCal();
    });
  };
  openSheet(html(), () => {
    drawCal();
    document.getElementById("cancel").onclick = closeSheet;
    sheet.querySelectorAll(".chip").forEach(c => c.onclick = () => { haptic("light"); const [,f,t] = presets(todayIso)[Number(c.dataset.i)]; from = f; to = t; if (t) view = new Date(isoToDate(t).getFullYear(), isoToDate(t).getMonth(), 1); drawCal(); });
    document.getElementById("apply").onclick = () => {
      if (from && !to) to = from;
      state.range = from ? {from, to} : null;
      closeSheet(); setPeriod("custom", { scroll: !after });
      if (after) setTimeout(after, 50);
    };
  });
}

/* ---------- Выгрузка ---------- */
const PERIODS = [["7","Неделя"],["30","Месяц"],["90","3 месяца"],["365","Год"],["all","Всё время"]];
function openExport(){
  const R = state.data ? currentRange(state.data.today) : null;
  const custom = R ? [["custom", "Выбранный период: " + rangeLabel(R.from, R.to)]] : [];
  openSheet(`<div class="grab"></div><div class="sheet-h"><button type="button" id="cancel">Отмена</button><h2>Выгрузка в Excel</h2><span></span></div>
    <div class="hint">Файл придёт в чат с ботом</div>
    <div class="fields">${custom.concat(PERIODS).map(([k,l]) => `<button type="button" class="opt" data-k="${k}"><span>${l}</span><svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></button>`).join("")}</div>`, () => {
    document.getElementById("cancel").onclick = closeSheet;
    sheet.querySelectorAll(".opt").forEach(b => b.onclick = async () => {
      if (state.busy) return;
      try { state.busy = true; haptic("light"); toast("Готовлю файл…");
        const payload = b.dataset.k === "custom" ? {from: R.from, to: R.to} : {period: b.dataset.k};
        const res = await api("/api/export", {method:"POST", body: JSON.stringify(payload)});
        haptic("ok"); closeSheet(); toast(`Отправлено в чат: ${res.count} ${plural(res.count,"запись","записи","записей")}`);
      } catch(e){ haptic("err"); toast(e.message); } finally { state.busy = false; }
    });
  });
}
function setBusy(b){ state.busy = b; const s = document.getElementById("save"); if (s) s.disabled = b; }
let toastT; function toast(m){ const t = document.getElementById("toast"); t.classList.remove("action"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200); }

/* ---------- Load ---------- */
async function load(first=true){
  try { state.data = await api("/api/state"); render(); document.getElementById("adminTop").hidden = !(state.data.user && state.data.user.is_admin); if (first) showMain(); }
  catch(e){
    document.getElementById("app").innerHTML = `<section class="section"><div class="card"><div class="empty"><div class="big">🔒</div>${esc(e.message)}</div></div></section>`;
  }
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.data) load(false); });
})();
