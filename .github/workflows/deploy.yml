name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "install — установить/обновить; restart; logs; diagnose; reset-data — удалить ВСЕ данные бота (траты, лимиты, ключ шифрования)"
        required: true
        default: install
        type: choice
        options: [install, restart, logs, diagnose, reset-data, ai-install, ai-login, ai-code, ai-logs, ai-replies, ai-stop]
      code:
        description: "Только для ai-code: код входа из Telegram"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: 201.24.120.213
      WEBAPP_DOMAIN: ${{ vars.WEBAPP_DOMAIN || '201.24.120.213.sslip.io' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      ACTION: ${{ inputs.action }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAD_API_KEY: ${{ secrets.CHAD_API_KEY }}
      POLZA_API_KEY: ${{ secrets.POLZA_API_KEY }}
      PROVERKACHEKA_TOKEN: ${{ secrets.PROVERKACHEKA_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_PHONE: ${{ secrets.TG_PHONE }}
      TG_2FA_PASSWORD: ${{ secrets.TG_2FA_PASSWORD }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      LOGIN_CODE: ${{ inputs.code }}
      AI_RUN: cd /root/bot/ai_responder && ENV_FILE=/root/ai_responder_data/.env venv/bin/python
      SSH_OPTS: -o StrictHostKeyChecking=no -o ConnectTimeout=20
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Check connection
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" \
            'echo "connected: $(hostname)"; head -2 /etc/os-release; python3 --version 2>&1; uname -m; free -m | head -2; df -h / | tail -1'

      - name: Diagnose server
        if: env.ACTION == 'diagnose'
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'bash -s' <<'REMOTE'
          echo "== listening ports =="; ss -tlnp | awk 'NR==1 || /LISTEN/' | sed -E 's/users:\(\("([^"]+)".*/\1/'
          echo "== running services =="; systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}'
          echo "== docker =="; command -v docker >/dev/null && docker ps --format '{{.Names}}  {{.Image}}  {{.Ports}}' || echo "no docker"
          echo "== nginx/caddy/apache =="; for b in nginx caddy apache2 httpd; do command -v $b >/dev/null && echo "$b: installed"; done; true
          echo "== nginx sites =="; ls /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null; true
          echo "== certs =="; ls /etc/letsencrypt/live 2>/dev/null || echo "no letsencrypt"; true
          for c in /etc/letsencrypt/live/*/fullchain.pem; do [ -f "$c" ] && echo "$c: $(openssl x509 -noout -subject -enddate -in "$c" | tr '\n' ' ')"; done; true
          echo "== renew timer =="; systemctl list-timers --no-pager --no-legend 2>/dev/null | grep -i certbot || echo "нет таймера certbot"; true
          echo "== TLS снаружи =="; echo | openssl s_client -connect 127.0.0.1:443 -servername "$WEBAPP_DOMAIN" 2>/dev/null | openssl x509 -noout -subject -dates 2>/dev/null || echo "рукопожатие не удалось"; true
          echo "== nginx конфиг раскодов =="; nginx -T 2>/dev/null | awk '/server_name .*sslip/,/^}/' | head -40; true
          echo "== nginx errors =="; tail -25 /var/log/nginx/error.log 2>/dev/null || echo "нет error.log"; true
          echo "== nginx access (последние 25) =="; tail -25 /var/log/nginx/access.log 2>/dev/null || echo "нет access.log"; true
          echo "== ответы 5xx в логе =="; awk '$9 ~ /^5/' /var/log/nginx/access.log 2>/dev/null | tail -15; echo "всего 5xx: $(awk '$9 ~ /^5/' /var/log/nginx/access.log 2>/dev/null | wc -l)"; true
          echo "== запросы приложения за сутки =="; grep -c "iPhone\|Android" /var/log/nginx/access.log 2>/dev/null; grep "iPhone\|Android" /var/log/nginx/access.log 2>/dev/null | awk '{print $9}' | sort | uniq -c | sort -rn; true
          echo "== hostname =="; hostname -f 2>/dev/null; true
          echo "== bot =="; systemctl is-active bot_raskhody; ls -la /root/bot | grep -E 'json|\.env'; true
          echo "== firewall =="; command -v ufw >/dev/null && ufw status | head -15 || echo "no ufw"; true
          echo "== AI selftest =="; cd /root/bot && venv/bin/python deploy/selftest.py 2>&1 | sed -E 's#[0-9]{8,}:[A-Za-z0-9_-]{30,}#<TOKEN>#g'; true
          echo "== предупреждения и ошибки за 6 часов =="; journalctl -u bot_raskhody -u bot_raskhody-web --since "-6h" --no-pager | grep -iE "warn|error|traceback|polza|chad|receipt|ChadGPT" | tail -40 | sed -E 's#[0-9]{8,}:[A-Za-z0-9_-]{30,}#<TOKEN>#g'; true
          echo "== mem/disk =="; free -m | head -2; df -h / | tail -1
          REMOTE

      - name: Reset data (delete all expenses, limits, encryption key)
        if: env.ACTION == 'reset-data'
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'systemctl stop bot_raskhody bot_raskhody-web; cd /root/bot && rm -f data.db data.db-wal data.db-shm .data_key expenses.json limits.json expenses.json.imported limits.json.imported && echo "данные удалены"; systemctl start bot_raskhody bot_raskhody-web; sleep 5; echo "bot: $(systemctl is-active bot_raskhody)  web: $(systemctl is-active bot_raskhody-web)"'

      - name: Install / update bot
        if: env.ACTION == 'install'
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" \
            "APP_DIR=/root/bot BRANCH=${{ github.ref_name }} WEBAPP_DOMAIN=$WEBAPP_DOMAIN bash -s" < deploy/install.sh

      - name: Write .env on server
        if: env.ACTION == 'install' && env.TELEGRAM_TOKEN != ''
        run: |
          echo "::add-mask::$TELEGRAM_TOKEN"
          { printf 'TELEGRAM_TOKEN=%s\n' "$TELEGRAM_TOKEN"; [ -n "$CHAD_API_KEY" ] && printf 'CHAD_API_KEY=%s\n' "$CHAD_API_KEY"; [ -n "$POLZA_API_KEY" ] && printf 'POLZA_API_KEY=%s\n' "$POLZA_API_KEY"; [ -n "$PROVERKACHEKA_TOKEN" ] && printf 'PROVERKACHEKA_TOKEN=%s\n' "$PROVERKACHEKA_TOKEN"; [ -n "$OWNER_ID" ] && printf 'OWNER_ID=%s\n' "$OWNER_ID"; printf 'WEBAPP_URL=https://%s\n' "$WEBAPP_DOMAIN"; } \
            | sshpass -e ssh $SSH_OPTS "root@$HOST" 'cat > /root/bot/.env.tmp && chmod 600 /root/bot/.env.tmp && mv -f /root/bot/.env.tmp /root/bot/.env && echo ".env записан"'

      - name: Restart bot
        if: env.ACTION == 'install' || env.ACTION == 'restart'
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'systemctl restart bot_raskhody bot_raskhody-web; sleep 8; echo "bot: $(systemctl is-active bot_raskhody)  web: $(systemctl is-active bot_raskhody-web)"; curl -s -o /dev/null -w "local api: %{http_code}\n" http://127.0.0.1:8080/health'
          curl -s -o /dev/null -w "https://$WEBAPP_DOMAIN/health -> %{http_code}\n" "https://$WEBAPP_DOMAIN/health" || true

      - name: AI responder — install / update
        if: env.ACTION == 'ai-install'
        run: |
          for v in TG_API_ID TG_API_HASH TG_PHONE; do
            [ -n "${!v}" ] || { echo "::error::Нет секрета $v (Settings → Secrets and variables → Actions)"; exit 1; }
          done
          [ -n "$AI_API_KEY$POLZA_API_KEY$CHAD_API_KEY" ] || { echo "::error::Нужен ключ нейросети: POLZA_API_KEY, CHAD_API_KEY или AI_API_KEY"; exit 1; }
          python3 - > ai.env <<'PY'
          import os
          e = os.environ
          env = dict(DATA_DIR="/root/ai_responder_data")
          # нейросеть: свой AI_API_KEY → Polza (как у бота расходов) → ChadGPT
          if e.get("AI_API_KEY") or not e.get("POLZA_API_KEY"):
              env.update(AI_PROVIDER="chadgpt", AI_MODEL="gpt-4o-mini",
                         AI_API_KEY=e.get("AI_API_KEY") or e.get("CHAD_API_KEY", ""))
          else:
              env.update(AI_PROVIDER="openai", AI_BASE_URL="https://api.polza.ai/api/v1",
                         AI_MODEL=e.get("AI_MODEL") or "anthropic/claude-sonnet-5.5", AI_API_KEY=e["POLZA_API_KEY"])
          for k in ["TG_API_ID", "TG_API_HASH", "TG_PHONE", "TG_2FA_PASSWORD"]:
              if os.environ.get(k):
                  env[k] = os.environ[k]
          for k, v in env.items():
              print(k + '="' + v.replace("\\", "\\\\").replace('"', '\\"') + '"')
          PY
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'mkdir -p /root/ai_responder_data && chmod 700 /root/ai_responder_data && cat > /root/ai_responder_data/.env.tmp && chmod 600 /root/ai_responder_data/.env.tmp && mv -f /root/ai_responder_data/.env.tmp /root/ai_responder_data/.env && echo ".env автоответчика записан"' < ai.env
          rm -f ai.env
          sshpass -e ssh $SSH_OPTS "root@$HOST" "BRANCH=${{ github.ref_name }} bash -s" <<'REMOTE'
          set -e
          cd /root/bot
          git fetch -q origin "$BRANCH"
          git checkout -q "origin/$BRANCH" -- ai_responder
          cd ai_responder
          [ -x venv/bin/python ] || python3 -m venv venv
          venv/bin/pip install -q --upgrade pip
          venv/bin/pip install -q -r requirements.txt
          cp ai_responder.service /etc/systemd/system/ai_responder.service
          systemctl daemon-reload
          # работающий бот держит файл сессии, поэтому сначала смотрим на сервис
          if systemctl is-active -q ai_responder || ENV_FILE=/root/ai_responder_data/.env venv/bin/python login.py status; then
            systemctl enable -q --now ai_responder && systemctl restart ai_responder
            sleep 8; echo "ai_responder: $(systemctl is-active ai_responder)"
          else
            echo "==> Теперь запусти ai-login"
          fi
          REMOTE

      - name: AI responder — send login code
        if: env.ACTION == 'ai-login'
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" "$AI_RUN login.py start"

      - name: AI responder — sign in with code
        if: env.ACTION == 'ai-code'
        run: |
          CODE=$(printf '%s' "$LOGIN_CODE" | tr -cd 0-9)
          echo "::add-mask::$CODE"
          [ -n "$CODE" ] || { echo "::error::Укажи код в поле code"; exit 1; }
          sshpass -e ssh $SSH_OPTS "root@$HOST" "$AI_RUN login.py code $CODE && systemctl enable -q --now ai_responder && systemctl restart ai_responder && sleep 10 && echo \"ai_responder: \$(systemctl is-active ai_responder)\""

      - name: AI responder — stop
        if: env.ACTION == 'ai-stop'
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'systemctl disable -q --now ai_responder; echo "ai_responder: $(systemctl is-active ai_responder)"'

      - name: AI responder — logs
        if: startsWith(env.ACTION, 'ai-')
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'journalctl -u ai_responder -n 40 --no-pager || true'

      - name: AI responder — recent replies
        if: env.ACTION == 'ai-replies'
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'journalctl -u ai_responder --since "-7 days" --no-pager -o short-iso | grep -E "Ответил|Отправил согласованный" | tail -40 || true'

      - name: Show logs
        if: ${{ !startsWith(env.ACTION, 'ai-') }}
        run: |
          sshpass -e ssh $SSH_OPTS "root@$HOST" 'journalctl -u bot_raskhody -n 25 --no-pager; echo "===== web ====="; journalctl -u bot_raskhody-web -n 25 --no-pager' \
            | sed -E 's#[0-9]{8,}:[A-Za-z0-9_-]{30,}#<TOKEN>#g'
